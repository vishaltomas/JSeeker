<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>JSeeker — Job Application Autofill</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <header class="toolbar">
        <span class="brand">JSeeker</span>
        <input
          id="url-input"
          class="url-input"
          type="text"
          placeholder="Paste a job application link and press Enter…"
          autocomplete="off"
        />
        <button id="open-btn" class="btn">Open</button>
        <label class="auto-toggle" title="Re-fill automatically as the form changes or navigates">
          <input type="checkbox" id="auto-toggle" /> Auto
        </label>
        <button id="autofill-btn" class="btn btn-primary" disabled>
          Autofill
        </button>
      </header>

      <div class="body">
        <aside class="sidebar">
          <h2>Your Info</h2>
          <form id="profile-form" class="profile-form"></form>

          <div class="resume">
            <label class="resume-label">Resume</label>
            <div class="resume-row">
              <span id="resume-name" class="resume-name">No file selected</span>
              <button id="resume-btn" class="btn" type="button">Choose…</button>
            </div>
          </div>

          <button id="save-btn" class="btn btn-block">Save Info</button>
          <p id="status" class="status"></p>
        </aside>

        <main class="viewer">
          <div id="placeholder" class="placeholder">
            Paste an application link above to begin.
          </div>
          <webview
            id="view"
            class="webview"
            src="about:blank"
            allowpopups
            useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          ></webview>
        </main>
      </div>
    </div>

    <script src="./renderer.js"></script>
  </body>
</html>
