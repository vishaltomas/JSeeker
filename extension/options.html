<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>JSeeker Chat — Settings</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 420px; margin: 24px; color: #1f2328; }
    h1 { font-size: 16px; }
    p { font-size: 13px; color: #57606a; line-height: 1.5; }
    input { width: 100%; box-sizing: border-box; padding: 8px; font-family: monospace; font-size: 13px; margin: 8px 0; }
    button { padding: 6px 14px; font-size: 13px; cursor: pointer; }
    #status { font-size: 12px; color: #57606a; margin-top: 8px; min-height: 16px; }
  </style>
</head>
<body>
  <h1>JSeeker Chat</h1>
  <p>Paste the sync token from JSeeker's Settings → Extension panel. Then, with JSeeker
  running, press <b>Alt+J</b> (or click the extension's icon) on any page to open the chat
  panel.</p>
  <input id="token" placeholder="Sync token" autocomplete="off">
  <button id="save">Save</button>
  <p id="status"></p>
  <script src="options.js"></script>
</body>
</html>
